name: Test, Release (if [release/bump]) and Publish

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yaml

  release:
    uses: ./.github/workflows/releases.yaml
    if: github.event.pull_request.merged == true || github.event_name == 'push'

  publish:
    needs: [test, release]
    if: needs.release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v${{ needs.release.outputs.next-version }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.4.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Build package
        run: uvx --with uv-dynamic-versioning hatchling build -d ./dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
