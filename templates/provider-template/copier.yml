_envops:
  autoescape: false
  block_end_string: "-%}"
  block_start_string: "{%-"
  comment_end_string: "%}"
  comment_start_string: "{#"
  keep_trailing_newline: true
  variable_end_string: "}}"
  variable_start_string: "{{"

_preserve_paths:
  - .gitignore

_tasks:
  - git init

_answers_file: .copier-answers.yml
_templates_suffix: ".jinja"

_unsafe: true

package_name:
  type: str
  help: Provider distribution name

package_slug:
  type: str
  help: Provider import package name

provider_scheme:
  type: str
  help: URI scheme resolved by this provider

author_name:
  type: str
  help: What is your name?
  default: "Author Name"

author_email:
  type: str
  help: What is your email?
  default: "author@example.com"

project_description:
  type: str
  help: Brief provider description
  default: "An invoke-toolkit field resolver provider"

python_version:
  type: str
  help: Minimum Python version required
  default: "3.11"
