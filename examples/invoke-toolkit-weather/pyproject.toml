[project]
name = "invoke-toolkit-weather"
version = "0.1.0"
description = "Example extension demonstrating config schemas"
requires-python = ">=3.11"
dependencies = [
    "invoke-toolkit",
    "attrs>=24.0.0",
]

[project.entry-points."invoke_toolkit.collection"]
weather = "invoke_toolkit_weather:collection"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoke_toolkit_weather"]
